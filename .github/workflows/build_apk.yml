name: Generate Project & Build Kadr APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Generate Full Android Project Tree
        run: python3 generate_project.py

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 4. Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: 5. Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: 6. Upload Ready APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kadr-Wedding-Poses-APK
          path: app/build/outputs/apk/debug/app-debug.apk
